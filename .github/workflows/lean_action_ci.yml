name: Lean proof audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The strict reference gate reads the immutable reviewed author commit.
          fetch-depth: 0
      - name: Install committed toolchain and fetch pinned Mathlib cache
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          # Always elaborate first-party source for the candidate revision.
          use-github-cache: false
      - name: Check dependency lock files were preserved
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Build, audit, and exercise failure regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .lake/verification-diagnostics
          printf 'checkout_commit=%s\ncheckout_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            > .lake/verification-diagnostics/checkout.txt
          if ./scripts/verify.sh 2>&1 | tee .lake/verification-diagnostics/verify.log; then
            verify_status=0
            capture_status=0
          else
            pipeline_status=("${PIPESTATUS[@]}")
            verify_status=${pipeline_status[0]}
            capture_status=${pipeline_status[1]}
          fi
          if printf 'verify_exit=%s\ncapture_exit=%s\n' "$verify_status" "$capture_status" \
              > .lake/verification-diagnostics/exit-status.txt; then
            metadata_status=0
          else
            metadata_status=$?
          fi
          if (( verify_status != 0 )); then exit "$verify_status"; fi
          if (( capture_status != 0 )); then exit "$capture_status"; fi
          exit "$metadata_status"
      - name: Retain strict verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/verification-diagnostics/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: Retain immutable reference and full API comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v59-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/v59-reference-evidence/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Check dependency lock files remain unchanged
        if: always()
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json

  author-diagnostics:
    name: Author uploads (advisory diagnostics)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install committed toolchain and fetch pinned Mathlib cache
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Compile author uploads independently (not the stable proof audit)
        id: drafts
        continue-on-error: true
        run: python3 scripts/check_author_drafts.py
      - name: Publish advisory outcomes, including failures
        if: always()
        run: python3 scripts/report_author_drafts.py
      - name: Retain author diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: author-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/author-diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Check dependency lock files remain unchanged
        if: always()
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
